consent:
  - name: default
    steps:
      - name: Consent
        elements:
          - type: prompt
            file: intro/consent.prompt.md
          - type: submitButton
            buttonText: "I consent"

introSequences:
  - name: default
    introSteps:
      - name: "Intro"
        elements:
          - type: prompt
            file: intro/intro.prompt.md
          - type: submitButton
            buttonText: "Start"

treatments:
  - name: compare
    playerCount: 1
    compatibleIntroSequences: [default]
    gameStages:
      - name: first video
        duration: 600
        elements:
          - type: prompt
            file: task/video_1_title.prompt.md
          - type: mediaPlayer
            file: ${video_1_url}
            name: video_1
          - type: prompt
            file: task/liking.prompt.md
            name: liking_1
          - type: submitButton
            buttonText: "Next"

      - name: second video
        duration: 600
        elements:
          - type: prompt
            file: task/video_2_title.prompt.md
          - type: mediaPlayer
            file: ${video_2_url}
            name: video_2
          - type: prompt
            file: task/liking.prompt.md
            name: liking_2
          - type: submitButton
            buttonText: "Next"

    exitSequence:
      - name: Debrief
        elements:
          - type: prompt
            file: exit/debrief.prompt.md
          - type: submitButton
            buttonText: "Finish"
